name: Windows stable releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested downloads as a GitHub Release
        type: boolean
        default: true
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: windows-stable-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    name: Validate pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test release selection and packaging
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell scripts
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

  resolve:
    name: Resolve stable upstream tags
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      release_tag: ${{ steps.sources.outputs.release_tag }}
      should_build: ${{ steps.status.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select highest stable version of every component
        id: sources
        run: python scripts/resolve.py --github-output $env:GITHUB_OUTPUT
      - name: Skip an already published scheduled release
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_status.py --github-output $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-manifest
          path: sources.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.project }} (Windows x64)
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-manifest
      - name: Prepare dependency cache directory
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          $nativeCache = Join-Path $env:RUNNER_TEMP 'vcpkg-cache'
          New-Item -ItemType Directory -Force $nativeCache > $null
          "VCPKG_DEFAULT_BINARY_CACHE=$nativeCache" >> $env:GITHUB_ENV
          $resolvedProject = (Get-Content sources.json -Raw | ConvertFrom-Json).projects |
            Where-Object { $_.id -eq $env:PROJECT }
          if (-not $resolvedProject) { throw 'The project is missing from the source manifest' }
          "UPSTREAM_COMMIT=$($resolvedProject.commit)" >> $env:GITHUB_ENV
          "RUNNER_IMAGE=$env:ImageVersion" >> $env:GITHUB_ENV
      - name: Restore static OpenSSL build cache
        if: contains(fromJSON('["sq", "chameleon", "wot", "cryptoki"]'), matrix.project)
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-static-md-${{ github.run_id }}
          restore-keys: vcpkg-windows-static-md-
      - name: Install native build dependencies
        env:
          PROJECT: ${{ matrix.project }}
        run: ./scripts/setup-windows.ps1 -SkipOpenSsl:($env:PROJECT -in @('sqv', 'sop', 'keystore'))
      - name: Save static OpenSSL build cache
        if: contains(fromJSON('["sq", "chameleon", "wot", "cryptoki"]'), matrix.project)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-static-md-${{ github.run_id }}
      - name: Select stable Rust and the native MSVC target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'Rust target installation failed' }
          "RUST_VERSION=$(rustc --version)" >> $env:GITHUB_ENV
      - name: Restore Rust dependency and build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .build/${{ matrix.project }}/target
          key: rust-windows-${{ matrix.project }}-${{ env.RUNNER_IMAGE }}-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_COMMIT }}-${{ github.sha }}
          restore-keys: |
            rust-windows-${{ matrix.project }}-${{ env.RUNNER_IMAGE }}-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_COMMIT }}-
            rust-windows-${{ matrix.project }}-${{ env.RUNNER_IMAGE }}-${{ env.RUST_VERSION }}-
      - name: Build the pinned release and probe packaged executables
        env:
          PROJECT: ${{ matrix.project }}
        run: python scripts/build_project.py --project $env:PROJECT
      - name: Save Rust cache for subsequent builds
        if: always() && steps.rust-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .build/${{ matrix.project }}/target
          key: rust-windows-${{ matrix.project }}-${{ env.RUNNER_IMAGE }}-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_COMMIT }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: component-${{ matrix.project }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  package:
    name: Test and package the complete collection
    needs: [resolve, build]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-manifest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: component-*
          path: artifacts
      - name: Install native GnuPG for Chameleon integration tests
        run: ./scripts/setup-gnupg.ps1
      - name: Validate every component, test cryptography and make ZIPs
        run: python scripts/package.py --artifacts artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-downloads
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    name: Publish GitHub Release downloads
    needs: [resolve, package]
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-downloads
          path: dist
      - name: Upload assets to a draft, then publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish.py --downloads dist
